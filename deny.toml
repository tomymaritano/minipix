# cargo-deny: aplica la política de licencias del spec (§3) y advisories de seguridad.
# Ajustar la lista en el primer `cargo deny check` real del workspace (M1),
# pero NUNCA agregar licencias copyleft (GPL/LGPL/AGPL) sin discusión explícita.

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "IJG",            # mozjpeg crate
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
