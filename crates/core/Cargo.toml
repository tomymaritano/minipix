[package]
name = "minipix-core"
description = "Image compression/conversion core: PNG, JPEG, WebP, AVIF"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["native"]
# Códecs C de máxima calidad + paralelismo (build nativo)
native = [
  "dep:mozjpeg",
  "dep:libwebp-sys2",
  "dep:avif-decode",
  "oxipng/parallel",
  "quantette/threads",
  "ravif/asm",
  "ravif/threading",
]
# Perfil puro-Rust para wasm32 (fallbacks documentados; ver plan M2)
wasm = ["dep:jpeg-encoder"]

[dependencies]
thiserror = "2"
png = "0.18"
oxipng = { version = "10", default-features = false, features = ["zopfli"] }
quantette = { version = "0.6", default-features = false, features = ["kmeans", "std"] }
zune-jpeg = "0.5"
zune-core = "0.5"
mozjpeg = { version = "0.10", optional = true }
image-webp = "0.2"
libwebp-sys2 = { version = "0.2", features = ["1_2", "static"], optional = true }
ravif = { version = "0.13", default-features = false }
avif-decode = { version = "1", optional = true }
rgb = { version = "0.8", features = ["bytemuck"] }
imgref = "1"
bytemuck = "1"
avif-parse = "1"
moxcms = "0.8.1"
jpeg-encoder = { version = "0.7", features = ["std"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
oxipng = { version = "10", default-features = false, features = ["zopfli", "freestanding"] }

[dev-dependencies]
jpeg-encoder = "0.7"
png = "0.18"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
criterion = "0.5"

[lints]
workspace = true

[[bench]]
name = "codecs"
harness = false
