[package]
name = "minipix-core"
description = "Image compression/conversion core: PNG, JPEG, WebP, AVIF"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = "2"
png = "0.18"
oxipng = { version = "10", default-features = false, features = ["parallel", "zopfli"] }
quantette = { version = "0.6", features = ["threads"] }
zune-jpeg = "0.5"
zune-core = "0.5"
mozjpeg = "0.10"
image-webp = "0.2"
libwebp-sys2 = { version = "0.2", features = ["1_2", "static"] }
ravif = { version = "0.13", default-features = false, features = ["threading", "asm"] }
rgb = { version = "0.8", features = ["bytemuck"] }
imgref = "1"
bytemuck = "1"

[dev-dependencies]
jpeg-encoder = "0.7"

[lints]
workspace = true
